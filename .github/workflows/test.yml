name: Test TensorLy

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        BACKEND: ['numpy', 'pytorch', 'paddle']
        python-version: ['3.12']
        include:
          - BACKEND: 'numpy'
            python-version: '3.11'
            TENSORLY_TENALG_BACKEND: 'einsum'
          - BACKEND: 'jax'
            python-version: '3.13'
            TENSORLY_TENALG_BACKEND: 'einsum'
            TESTMON: true
          - BACKEND: 'tensorflow'
            python-version: '3.12'
            TENSORLY_TENALG_BACKEND: 'einsum'
            TESTMON: true

    steps:
    - uses: actions/checkout@v5
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: "pip"
        cache-dependency-path: |
          requirements.txt

    - name: Install dependencies and backend ${{matrix.BACKEND}}
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
        python -m pip install -r doc/requirements_doc.txt
        echo "Installing dependencies for BACKEND=${{matrix.BACKEND}}"
        if [[ "${{matrix.BACKEND}}" == "numpy" ]]; then
          echo "Installing sparse";
          pip install sparse;
        elif [[ "${{matrix.BACKEND}}" == "pytorch" ]]; then
          echo "Installing PyTorch";
          pip install torch torchvision;
        elif [[ "${{matrix.BACKEND}}" == "tensorflow" ]]; then
          echo "Installing TensorFlow";
          pip install tensorflow;
        elif [[ "${{matrix.BACKEND}}" == "jax" ]]; then
          echo "Installing JAX";
          pip install jax jaxlib;
        elif [[ "${{matrix.BACKEND}}" == "paddle" ]]; then
          echo "Installing PaddlePaddle";
          pip install 'setuptools>=65.0';
          pip install paddlepaddle==3.0.0b1 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/;
        fi

    - name: Install package
      run: |
        python -m pip install -e .

    # pytest-testmon (jax and tensorflow only) records which code each test
    # executes and, on branches other than main, re-runs only the affected tests.
    # One database per backend and environment; main always runs everything and
    # refreshes it. Installed package versions (minus the editable tensorly line,
    # which carries the commit) are part of the key; the last restore-key falls back
    # to any data for the backend, since testmon re-runs everything itself when the
    # installed packages changed.
    - name: Compute testmon cache key
      if: matrix.TESTMON
      id: testmon
      run: |
        echo "env=$(python -m pip freeze --exclude-editable | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

    - name: Restore testmon data
      if: matrix.TESTMON
      uses: actions/cache@v6
      with:
        path: .testmondata
        key: testmon-${{matrix.BACKEND}}-${{matrix.python-version}}-${{steps.testmon.outputs.env}}-${{hashFiles('.github/workflows/test.yml')}}-${{github.sha}}
        restore-keys: |
          testmon-${{matrix.BACKEND}}-${{matrix.python-version}}-${{steps.testmon.outputs.env}}-${{hashFiles('.github/workflows/test.yml')}}-
          testmon-${{matrix.BACKEND}}-${{matrix.python-version}}-

    - name: Test with backend ${{matrix.BACKEND}} pytest and coverage
      # Full run with coverage: every backend on main and tags, and numpy, pytorch
      # and paddle everywhere.
      if: ${{ !matrix.TESTMON || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
      run: |
        TENSORLY_BACKEND=${{matrix.BACKEND}} TENSORLY_TENALG_BACKEND=${{matrix.TENSORLY_TENALG_BACKEND || 'core'}} pytest -vv --cov tensorly --cov-report xml --durations=10 tensorly

    - name: Refresh testmon data with backend ${{matrix.BACKEND}}
      # testmon cannot collect data while coverage is running, hence a second run.
      if: ${{ matrix.TESTMON && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
      run: |
        TENSORLY_BACKEND=${{matrix.BACKEND}} TENSORLY_TENALG_BACKEND=${{matrix.TENSORLY_TENALG_BACKEND || 'core'}} pytest -vv --testmon-noselect --durations=10 tensorly

    - name: Test only affected tests with backend ${{matrix.BACKEND}}
      if: ${{ matrix.TESTMON && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}
      run: |
        TENSORLY_BACKEND=${{matrix.BACKEND}} TENSORLY_TENALG_BACKEND=${{matrix.TENSORLY_TENALG_BACKEND || 'core'}} pytest -vv --testmon --durations=10 tensorly

    - name: Check coverage with CodeCov
      if: ${{ hashFiles('coverage.xml') != '' }}
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.xml
        verbose: true
